name: Build Gladiator Manager Mod

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mod.yml"
      - "tools/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download Gladiator Manager 3.16.1
        run: |
          curl -L --fail --retry 4 -A "Mozilla/5.0" \
            -o original.apk \
            "https://d.apkpure.com/b/APK/com.rene.gladiatormanager?version=3.16.1"
          ls -lh original.apk
          sha256sum original.apk

      - name: Install Android build/decode tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip python3 apktool
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Decode APK
        run: |
          apktool d -f -o build/apktool original.apk
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("build/apktool/AndroidManifest.xml")
          t=p.read_text(errors="ignore")
          print(t[:12000])
          PY

      - name: Apply mod patch
        run: |
          python3 tools/patch_gladiator.py build/apktool

      - name: Build unsigned APK
        run: |
          apktool b build/apktool -o build/gladiator-mod-unsigned.apk
          zipalign -f 4 build/gladiator-mod-unsigned.apk build/gladiator-mod-aligned.apk

      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore build/mod.keystore \
            -storepass changeit -keypass changeit \
            -alias gladiator-mod -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Gladiator Manager Offline Mod"
          apksigner sign --ks build/mod.keystore --ks-pass pass:changeit \
            --key-pass pass:changeit --out build/gladiator-mod.apk \
            build/gladiator-mod-aligned.apk
          apksigner verify --verbose --print-certs build/gladiator-mod.apk

      - name: Upload mod APK
        uses: actions/upload-artifact@v4
        with:
          name: gladiator-manager-offline-mod
          path: build/gladiator-mod.apk
          compression-level: 0
