name: Decompile Gladiator APK

on:
  push:
    paths:
      - "original.apk"
      - ".github/workflows/decompile.yml"

jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip aapt apktool
          curl -L --fail --retry 3             -o /tmp/jadx.zip             https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx

      - name: Decompile with JADX
        run: |
          mkdir -p build/jadx
          /opt/jadx/bin/jadx             --deobf             --show-bad-code             -d build/jadx             original.apk

      - name: Decode with Apktool
        run: |
          mkdir -p build/apktool
          apktool d -f -o build/apktool original.apk

      - name: Inventory important classes and strings
        run: |
          {
            echo "=== Manifest ==="
            sed -n '1,220p' build/apktool/AndroidManifest.xml || true
            echo
            echo "=== Interesting Gladiator classes ==="
            find build/jadx/sources -type f 2>/dev/null \
              | grep -Ei 'GladiatorEditorActivity|GladiatorEquipmentFragment|TraitFactory|WeaponSelectionFactory|Inventory|Equipment' \
              | sort || true
            echo
            echo "=== Interesting source references ==="
            grep -RniE 'GladiatorEditorActivity|addTraitWithoutStats|removeTrait|addTrait\(|TraitFactory|WeaponSelectionFactory|GladiatorEquipmentFragment|save' \
              build/jadx/sources 2>/dev/null | head -n 400 || true
          } > build/inventory.txt

      - name: Upload decompilation
        uses: actions/upload-artifact@v4
        with:
          name: gladiator-decompilation
          path: |
            build/jadx
            build/apktool
            build/inventory.txt
          compression-level: 1
